<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GTwin</title>
<style>
:root{--bg:#eef2f4;--pn:#fff;--tx:#14212b;--mu:#66757f;--ac:#0b7a75;--ak:#fff;--bd:#d5dde2;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1519;--pn:#172127;--tx:#e4ebef;--mu:#8696a1;--ac:#4fd1c5;--ak:#04201e;--bd:#2a3841}}
:root[data-theme="dark"]{--bg:#0e1519;--pn:#172127;--tx:#e4ebef;--mu:#8696a1;--ac:#4fd1c5;--ak:#04201e;--bd:#2a3841}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font:14px/1.4 "Segoe UI",system-ui,sans-serif;overflow:hidden}
[hidden]{display:none!important}
#app{display:flex;flex-direction:column;height:100%}
#bar{display:flex;gap:8px;align-items:center;padding:8px 10px;background:var(--pn);border-bottom:1px solid var(--bd);overflow-x:auto}
#bar h1{font-size:17px;margin:0 6px 0 2px;letter-spacing:.2px}
#st{font-size:12px;color:var(--mu);white-space:nowrap;margin-left:auto;display:flex;align-items:center;gap:6px}
#dot{width:8px;height:8px;border-radius:50%;background:#2ea043}
.b,select{font:500 13px inherit;font-family:inherit;padding:7px 11px;border:1px solid var(--bd);background:var(--pn);color:var(--tx);border-radius:7px;cursor:pointer;white-space:nowrap}
.b:focus-visible,select:focus-visible,.ib:focus-visible{outline:2px solid var(--ac);outline-offset:1px}
.b[aria-pressed=true]{background:var(--ac);color:var(--ak);border-color:var(--ac)}
#stage{flex:1;min-height:0;position:relative}
#cv{width:100%;height:100%;display:block;touch-action:none;cursor:pointer}
#pn,#pp{position:absolute;top:10px;max-height:calc(100% - 20px);overflow:auto;background:var(--pn);border:1px solid var(--bd);border-radius:10px;padding:10px}
#pn{left:10px;width:270px}
#pp{right:10px;width:340px}
.ph{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:2px 0 6px}
.ph b{overflow-wrap:anywhere}
.ph .b{padding:3px 8px}
.mr{display:flex;align-items:center;gap:6px;padding:3px 0}
.mr input{margin:0}
.mr .mn{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ib{font:inherit;font-size:12px;padding:2px 7px;border:1px solid var(--bd);background:var(--pn);color:var(--tx);border-radius:6px;cursor:pointer}
.mh{font-weight:700;margin-top:10px;overflow-wrap:anywhere}
.fl{font-weight:600;margin-top:6px}
.rm{padding:4px 8px;border-radius:6px;cursor:pointer;color:var(--mu)}
.rm:hover{background:var(--bd)}.rm.on{background:var(--ac);color:var(--ak)}
.mu{color:var(--mu);margin:2px 0 8px;overflow-wrap:anywhere}
details{border-top:1px solid var(--bd);padding:2px 0}
summary{cursor:pointer;font-weight:600;padding:6px 0;overflow-wrap:anywhere}
.pt{width:100%;border-collapse:collapse;font-size:12.5px;margin-bottom:6px}
.pt td{padding:3px 8px 3px 0;vertical-align:top;overflow-wrap:anywhere;word-break:break-word}
.pt td:first-child{color:var(--mu);width:42%}
#hint{position:absolute;left:10px;bottom:10px;max-width:calc(100% - 20px);background:var(--pn);border:1px solid var(--bd);padding:7px 11px;border-radius:8px}
@media (max-width:700px){#pn,#pp{top:auto;bottom:10px;left:10px;right:10px;width:auto;max-height:44%}#hint{bottom:auto;top:10px}}
#lg{position:fixed;inset:0;z-index:10;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:16px}
#lgf{width:100%;max-width:340px;background:var(--pn);border:1px solid var(--bd);border-radius:12px;padding:20px}
#lgf h2{margin:0 0 4px;font-size:20px}
#lgf label{display:block;margin:10px 0;font-weight:500}
#lgf input{display:block;width:100%;box-sizing:border-box;margin-top:4px;padding:8px 10px;border:1px solid var(--bd);border-radius:7px;background:var(--bg);color:var(--tx);font:inherit}
#lgf input:focus-visible{outline:2px solid var(--ac);outline-offset:1px}
#lgf .b{width:100%;margin-top:4px}
#lgm{min-height:1.4em}
.b:disabled{opacity:.5;cursor:default}
#sx{position:absolute;right:10px;bottom:10px;width:310px;background:var(--pn);border:1px solid var(--bd);border-radius:10px;padding:10px;max-height:calc(100% - 20px);overflow:auto}
#sx .sr{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center;margin:8px 0}
#sx .sr label{display:flex;gap:5px;align-items:center;font-weight:600;min-width:58px}
#sx input[type=range]{width:100%;accent-color:var(--ac)}
#sx .sr .b{padding:4px 8px;font-size:12px}
#sx .sh{display:flex;justify-content:space-between;align-items:center;gap:8px}
#sx .sk{display:flex;gap:6px;align-items:center;margin:6px 0 2px;font-weight:600}
#sx .mu{color:var(--mu);font-size:12px}
@media (max-width:700px){#sx{bottom:auto;top:10px;left:10px;right:10px;width:auto}}
.pill{display:inline-block;font-size:11.5px;font-weight:600;padding:2px 9px;border-radius:99px;border:1px solid var(--ac);color:var(--ac)}
#pp .ph{align-items:center}.pn{margin:8px 0 6px;font-size:16px;overflow-wrap:anywhere}
.pi td:first-child{width:34%}.pbar{margin:8px 0 4px}.pl{font-size:11px;letter-spacing:.06em;color:var(--mu);font-weight:600;margin:12px 0 6px}
.pcard{border:1px solid var(--bd);border-radius:9px;padding:2px 10px;margin:0 0 8px}.pcard summary{display:flex;justify-content:space-between;gap:8px}.pcard .cn{color:var(--mu);font-weight:400;font-size:12px}
.pset{border:0;margin-top:8px}.pin{width:100%;box-sizing:border-box;font:inherit;padding:6px 8px;border:1px solid var(--bd);border-radius:6px;background:var(--bg);color:var(--tx)}
</style></head>
<body><div id="app">
<div id="bar">
<h1>GTwin</h1>
<button class="b" id="bo" title="Pilih satu atau beberapa file IFC">Buka IFC</button>
<select id="fl" aria-label="Filter lantai"></select>
<button class="b" data-t="ruang">Ruang</button>
<button class="b" data-t="potong" aria-pressed="false">Potong</button>
<button class="b" data-t="panel">Struktur model</button>
<button class="b" id="lo" hidden>Keluar</button>
<span id="st"><span id="dot"></span><span id="stt">Model contoh</span></span>
<input type="file" id="fi" accept=".ifc" multiple hidden>
</div>
<div id="stage"><canvas id="cv"></canvas>
<aside id="pn"><div class="ph"><b>Model</b><button class="b" id="cl">Tutup</button></div><div id="lib" hidden></div><div id="ml"></div><div id="tree"></div></aside>
<aside id="pp" hidden></aside>
<aside id="sx" hidden><div class="sh"><b>Potong (section)</b><span><button class="b" id="sxr">Reset</button> <button class="b" id="sxc">Tutup</button></span></div>
<div class="mu">Aktifkan sumbu, geser untuk memotong, dan klik ⇄ untuk membalik sisi yang dipotong.</div>
<div class="sr"><label><input type="checkbox" data-a="0"> Sumbu X</label><input type="range" min="0" max="1000" value="500" data-a="0" aria-label="Posisi potong X"><button class="b" data-f="0" title="Balik arah">⇄</button></div>
<div class="sr"><label><input type="checkbox" data-a="1"> Tinggi (Y)</label><input type="range" min="0" max="1000" value="500" data-a="1" aria-label="Posisi potong tinggi"><button class="b" data-f="1" title="Balik arah">⇄</button></div>
<div class="sr"><label><input type="checkbox" data-a="2"> Sumbu Z</label><input type="range" min="0" max="1000" value="500" data-a="2" aria-label="Posisi potong Z"><button class="b" data-f="2" title="Balik arah">⇄</button></div>
<label class="sk"><input type="checkbox" id="sxk" checked> Tutup penampang potongan</label>
<div class="mu" id="sxi"></div></aside>
<div id="hint" hidden></div></div></div>
<div id="lg"><form id="lgf"><h2>GTwin</h2><p class="mu">Masuk untuk membuka pustaka model.</p>
<label>Nama pengguna<input id="lgu" autocomplete="username" required></label>
<label>Kata sandi<input id="lgp" type="password" autocomplete="current-password" required></label>
<button class="b" id="lgb" style="background:var(--ac);color:var(--ak);border-color:var(--ac)">Masuk</button>
<p id="lgm" class="mu" role="alert">Memeriksa vault…</p></form></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="vault.js"></script>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"]/g,c=>'&#'+c.charCodeAt(0)+';');
const cv=$('#cv'),pp=$('#pp'),S={ruang:1,panel:innerWidth>700?1:0};
const R=new THREE.WebGLRenderer({canvas:cv,antialias:true,alpha:true}),sc=new THREE.Scene(),camr=new THREE.PerspectiveCamera(45,1,.1,300);
R.setPixelRatio(Math.min(devicePixelRatio,2));
sc.add(new THREE.HemisphereLight(0xffffff,0x8899aa,.95));
const dl=new THREE.DirectionalLight(0xffffff,.6);dl.position.set(10,25,12);sc.add(dl);
const gr=new THREE.GridHelper(60,30,0x8a98a5,0x8a98a5);gr.material.transparent=true;gr.material.opacity=.25;gr.position.y=-.05;sc.add(gr);
let K=1,MY=5,CEN=[0,0],mid=0,ORG=null,ST={},MS={};
const DS=THREE.DoubleSide,wm=new THREE.MeshStandardMaterial({color:0xdde5eb,side:DS}),sm=new THREE.MeshStandardMaterial({color:0xb4c0c9,side:DS}),edge=new THREE.LineBasicMaterial({color:0x56707d,transparent:true,opacity:.6}),
HM=new THREE.MeshBasicMaterial({color:0xff8a00,transparent:true,opacity:.9,side:DS,polygonOffset:true,polygonOffsetFactor:-2,polygonOffsetUnits:-2});
let models=[],floors=[],rooms=[],levels=[],ELS={},sel=null,hl=null,hlOwn=0,th=.8,ph=1,r=34,tg=new THREE.Vector3(0,5,0);
const rc=new THREE.Raycaster(),mo=new THREE.Vector2();
const hint=t=>{$('#hint').textContent=t;$('#hint').hidden=!t},status=t=>{$('#stt').textContent=t};
function cam(){camr.position.set(tg.x+r*Math.sin(ph)*Math.sin(th),tg.y+r*Math.cos(ph),tg.z+r*Math.sin(ph)*Math.cos(th));camr.lookAt(tg)}
function focus(p,d){tg.copy(p);r=d;cam()}
function scl(){gr.scale.setScalar(Math.max(K,.5));camr.near=.1*Math.max(K,1);camr.far=Math.max(300,K*400);camr.updateProjectionMatrix()}
function vis(){const f=$('#fl').value;floors.forEach(F=>{F.g.visible=f=='all'||+f==F.lv;F.rooms.forEach(q=>q.mesh.visible=!!S.ruang)})}
function sync(){document.querySelectorAll('[data-t]').forEach(b=>{if(b.dataset.t!='potong')b.setAttribute('aria-pressed',!!S[b.dataset.t])});$('#pn').hidden=!S.panel;vis()}
function list(){
$('#ml').innerHTML=models.map((m,i)=>`<div class="mr"><input type="checkbox" data-v="${i}"${m.on?' checked':''} aria-label="Tampilkan ${esc(m.name)}"><span class="mn" title="${esc(m.name)}">${esc(m.name)}</span><button class="ib" data-z="${i}" title="Zoom ke model ini">Fokus</button>${m.demo?'':`<button class="ib" data-x="${i}" title="Hapus model ini">×</button>`}</div>`).join('');
$('#tree').innerHTML=models.map((m,mi)=>(models.length>1?`<div class="mh">${esc(m.name)}</div>`:'')+m.floors.map((F,fi)=>`<div class="fl rm" data-f="${mi}-${fi}">${esc(F.name)}</div>`+F.rooms.map((q,ri)=>`<div class="rm${sel&&sel.room===q?' on':''}" data-r="${mi}-${fi}-${ri}">${esc(q.name)}</div>`).join('')).join('')).join('')}
function ui(){const n=Object.keys(ELS).length;status(models[0]&&models[0].demo?`Model contoh · ${n} elemen`:`${models.length} model · ${n} elemen`);sync();list();libRender()}
function buildLevels(){const all=[...floors].sort((a,b)=>a.y-b.y);levels=[];all.forEach(F=>{let l=levels[levels.length-1];if(!l||F.y-l.y>.75)levels.push(l={y:F.y,name:F.name});F.lv=levels.length-1});
$('#fl').innerHTML='<option value="all">Semua lantai</option>'+levels.map((l,i)=>`<option value="${i}">${esc(l.name)}</option>`).join('')}
function fitAll(){if(!models.length)return;const b=[1e18,-1e18,1e18,-1e18,1e18,-1e18];models.forEach(m=>{const x=m.box;b[0]=Math.min(b[0],x.x0);b[1]=Math.max(b[1],x.x1);b[2]=Math.min(b[2],x.y0);b[3]=Math.max(b[3],x.y1);b[4]=Math.min(b[4],x.z0);b[5]=Math.max(b[5],x.z1)});
const sx=b[1]-b[0],sy=b[3]-b[2],sz=b[5]-b[4];K=Math.max(sx,sz,1)/19;scl();CEN=[(b[0]+b[1])/2,(b[4]+b[5])/2];MY=(b[2]+b[3])/2;tg.set(CEN[0],MY,CEN[1]);r=Math.max(sx,sy,sz)*1.5+5;cam();try{secApply()}catch(e){}}
function fitModel(m){const x=m.box,sx=x.x1-x.x0,sy=x.y1-x.y0,sz=x.z1-x.z0;m.on=true;m.g.visible=true;focus(new THREE.Vector3((x.x0+x.x1)/2,(x.y0+x.y1)/2,(x.z0+x.z1)/2),Math.max(sx,sy,sz)*1.5+5);list()}
/* sorotan & properti */
function hlOff(){if(hl){if(hl.parent)hl.parent.remove(hl);if(hlOwn)hl.geometry.dispose();hl=null}}
function hlOn(el){hlOff();const m=el.mesh;if(!m)return;let g;if(el.s==null){g=m.geometry;hlOwn=0}else{g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(m.geometry.attributes.position.array.slice(el.s*9,el.e*9),3));hlOwn=1}
hl=new THREE.Mesh(g,HM);hl.position.copy(m.position);hl.renderOrder=2;m.parent.add(hl)}
const PK_DEF='fire rating,is external,load bearing,reference,status,acoustic rating,thermal transmittance,length,width,height,depth,thickness,area,volume,perimeter,manufacturer,model,serial number,mark,comments,material,elevation,constraint,unconnected,structural material,type mark,assembly code,phase,cost'.split(','),KEYS=['Nama','Jenis objek','Kelas IFC','GlobalId','Tag','Model','Lantai','Tipe elemen','Material','Nama panjang'];
const nz=s=>String(s).toLowerCase().replace(/[\s_]/g,''),lsg=k=>{try{return localStorage.getItem(k)}catch(e){return null}},lss=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};
let PKC=lsg('gtwin_pk')||'',PALL=lsg('gtwin_all')==='1',PLAST=null;
const pkMatch=k=>{const n=nz(k);return[...PK_DEF,...PKC.split(',')].map(x=>nz(x.trim())).filter(Boolean).some(w=>n.includes(w))};
function renderP(){if(!PLAST)return;const el=PLAST.el,sec=PLAST.sec,head=sec[0]||{r:[]},info=PALL?head.r:head.r.filter(x=>KEYS.includes(x[0])),
rest=sec.slice(1).map(s=>({t:s.t,n:s.r.length,r:PALL?s.r:s.r.filter(x=>pkMatch(x[0]))})).filter(s=>s.r.length),tot=sec.slice(1).reduce((a,s)=>a+s.r.length,0),sh=rest.reduce((a,s)=>a+s.r.length,0);
pp.innerHTML=`<div class="ph"><span class="pill">${esc(el.t)}</span><button class="b" id="pc">Tutup</button></div><h3 class="pn">${esc(el.n||'Tanpa nama')}</h3>`+
`<table class="pt pi">${info.map(x=>`<tr><td>${esc(x[0])}</td><td>${esc(x[1])}${x[0]=='GlobalId'?' <button class="ib" data-copy="'+esc(x[1])+'">Salin</button>':''}</td></tr>`).join('')}</table>`+
(tot?`<div class="pbar"><button class="b" id="pt">${PALL?'Hanya parameter penting':'Tampilkan semua properti ('+tot+')'}</button></div>`:'')+
(rest.length?`<div class="pl">DATA BIM · ${rest.length} SET PROPERTI${PALL?'':' · '+sh+' dari '+tot+' parameter'}</div>`:(tot?'<div class="pl">Tidak ada parameter penting pada elemen ini.</div>':''))+
rest.map((s,i)=>`<details class="pcard"${PALL?(i<3?' open':''):' open'}><summary>${esc(s.t)}<span class="cn">${PALL?s.n:s.r.length+'/'+s.n}</span></summary><table class="pt">${s.r.map(x=>`<tr><td>${esc(x[0])}</td><td>${esc(x[1])}</td></tr>`).join('')}</table></details>`).join('')+
`<details class="pset" id="psd"><summary>Atur parameter yang ditampilkan</summary><div class="mu">Tambahkan kata kunci nama parameter, dipisah koma (contoh: FireRating, Mark). Berlaku untuk semua elemen.</div><input id="pk" class="pin" value="${esc(PKC)}" placeholder="kata kunci tambahan"></details>`;
pp.hidden=false}
function showP(el){if(!el){pp.hidden=true;PLAST=null;return}
let sec;try{if(el.m.E){E=el.m.E;REL=el.m.REL;UNIT=el.m.u}sec=el.demo||props(el)}catch(x){sec=[{t:'Informasi umum',r:[['Nama',el.n],['Kelas IFC',el.t]]}]}
PLAST={el,sec};renderP();pp.scrollTop=0;if(innerWidth<=700&&S.panel){S.panel=0;sync()}}
function select(el){sel=el||null;hlOff();rooms.forEach(q=>q.mesh.material.opacity=sel&&sel.room===q?.6:.28);if(sel&&!sel.room)hlOn(sel);if(sel)hint('');showP(sel);list()}
pp.onclick=e=>{const t=e.target;if(t.id=='pc')select(null);else if(t.id=='pt'){PALL=!PALL;lss('gtwin_all',PALL?'1':'0');renderP()}else if(t.dataset&&t.dataset.copy!=null){try{navigator.clipboard.writeText(t.dataset.copy);t.textContent='Tersalin'}catch(x){}}};
pp.onchange=e=>{if(e.target.id=='pk'){PKC=e.target.value;lss('gtwin_pk',PKC);renderP();const d=pp.querySelector('.pset');if(d)d.open=true}};
addEventListener('keydown',e=>{if(e.key=='Escape')select(null)});
/* material & tekstur */
const KIND={plaster:[0xe9e4d8],concrete:[0xb9b9b3],brick:[0xb85f45],wood:[0x9a6b3f],tile:[0xd4d8da],metal:[0x8a9099],roof:[0xa8523a],stone:[0xaaa597],glass:[0xa6d3e8],plain:[0xd5d9dd]};
function kindOf(t,names){const s=(names||'').toLowerCase();
if(/glass|kaca|glas\b|vidr|verre/.test(s))return'glass';if(/brick|bata|baksteen|ziegel/.test(s))return'brick';if(/concrete|beton|cement|semen|screed/.test(s))return'concrete';
if(/wood|kayu|timber|oak|pine|plywood|bamboo|bambu|parket|parquet/.test(s))return'wood';if(/steel|baja|metal|alumin|besi|iron|zinc|seng|copper|tembaga|stainless/.test(s))return'metal';
if(/tile|keramik|ceramic|porcel/.test(s))return/roof|genteng/.test(s)?'roof':'tile';if(/genteng|roof/.test(s))return'roof';if(/stone|batu|granit|marmer|marble|slate/.test(s))return'stone';if(/plaster|gypsum|gipsum|paint|cat\b|plester|acian/.test(s))return'plaster';
if(/^IFC(WINDOW|CURTAINWALL)/.test(t))return'glass';if(/^IFCDOOR/.test(t))return'wood';if(/^IFCROOF/.test(t))return'roof';if(/^IFC(SLAB|COLUMN|BEAM|FOOTING|PILE|STAIR|RAMP)/.test(t))return'concrete';
if(/^IFC(RAILING|MEMBER|PLATE)/.test(t))return'metal';if(/^IFCCOVERING/.test(t))return'tile';if(/^IFC(FURNISHING|FURNITURE)/.test(t))return'wood';if(/^IFCWALL/.test(t))return'plaster';return'plain'}
const MATS={};
function mat(kind,hex,op){const k=hex+'|'+op.toFixed(2);if(MATS[k])return MATS[k];
return MATS[k]=new THREE.MeshLambertMaterial({color:hex,transparent:op<.99,opacity:op,side:DS,depthWrite:op>=.99})}
/* model contoh */
const DN=['Lobi','Rapat','Server','Kantor 1','Kantor 2','Pantry'];
function buildDemo(){const m={k:'demo',name:'Model contoh',demo:1,on:true,g:new THREE.Group(),floors:[],box:{x0:-9.5,x1:9.5,y0:0,y1:9.8,z0:-5.5,z1:5.5},cx:0,cz:0};let n=0,wn=0;
['Lantai 1','Lantai 2','Lantai 3'].forEach((nm,i)=>{const g=new THREE.Group(),y=i*3.4,F={g,m,y,name:nm,pk:[],rooms:[]};
const reg=(me,t,name,rows)=>{const id='d'+(++n),key='demo:'+id;me.userData.el=key;ELS[key]={key,id,t,n:name,F,m,mesh:me,demo:[{t:'Informasi umum',r:[['Nama',name],['Kelas IFC',t],['Lantai',nm],['Catatan','Model contoh bawaan. Buka file IFC untuk melihat properti asli.']]},{t:'Dimensi',r:rows}]};F.pk.push(me)};
const slab=new THREE.Mesh(new THREE.BoxGeometry(19,.3,11),mat('concrete',0xb9b9b3,1));slab.position.y=y;g.add(slab);reg(slab,'IFCSLAB','Pelat '+nm,[['Panjang','19 m'],['Lebar','11 m'],['Tebal','0,3 m']]);

/* muat IFC (mendukung banyak model) */
function loadIFC(text,label){
if(!/ISO-10303-21/.test(text.slice(0,300)))throw new Error('format tidak dikenali (butuh file IFC berformat STEP)');
const M={k:++mid,name:label,u:1,on:true,g:new THREE.Group(),floors:[],REL:{def:{},type:{},mat:{},cont:{}}};
E={};PC={};REL=M.REL;ST={};MS={};M.E=E;
const re=/#(\d+)\s*=\s*([A-Z0-9_]+)\s*\(([\s\S]*?)\)\s*;/g,Q="'(?:[^']|'')*'",pdr=new RegExp("^"+Q+",\\s*(?:#\\d+|\\$),\\s*(?:"+Q+"|\\$),\\s*(?:"+Q+"|\\$),\\s*(?:"+Q+"|\\$),\\s*(?:#\\d+|\\$),\\s*#(\\d+)"),prods=[],sts=[];let m;
while(m=re.exec(text))E[m[1]]={t:m[2],s:m[3]};
for(const id in E){const e=E[id];if(e.t=='IFCBUILDINGSTOREY')sts.push(+id);else if(!/^IFC(OPENINGELEMENT|VIRTUALELEMENT|ANNOTATION|GRID)$/.test(e.t)){const q=pdr.exec(e.s);if(q&&E[q[1]]&&E[q[1]].t=='IFCPRODUCTDEFINITIONSHAPE')prods.push(+id)}}
let u=1;const si=Object.values(E).find(e=>e.t=='IFCSIUNIT'&&/\.LENGTHUNIT\./.test(e.s));if(si)u={MILLI:.001,CENTI:.01,DECI:.1}[(/\.([A-Z]+)\.,\s*\.METRE\./.exec(si.s)||[])[1]]||1;
if(/IFCCONVERSIONBASEDUNIT\([^;]*LENGTHUNIT[^;]*'(?:FOOT|foot)'/.test(text))u=.3048;
UNIT=M.u=u;
for(const id in E){const t=E[id].t,k={IFCRELDEFINESBYPROPERTIES:'def',IFCRELDEFINESBYTYPE:'type',IFCRELASSOCIATESMATERIAL:'mat',IFCRELCONTAINEDINSPATIALSTRUCTURE:'cont'}[t];if(!k)continue;
try{const a=A(id),o=L(a[4]);if(k=='def')o.forEach(x=>(REL.def[x]=REL.def[x]||[]).push(...L(a[5])));else o.forEach(x=>REL[k][x]=a[5])}catch(x){}}
for(const id in E){const t=E[id].t;try{
if(t=='IFCSTYLEDITEM'){const a=A(id);if(typeof a[0]=='number'){const s=styleCol(id);if(s)ST[a[0]]=s}}
else if(t=='IFCMATERIALDEFINITIONREPRESENTATION'){const a=A(id);L(a[2]).forEach(rp=>L(A(rp)[3]).forEach(i=>{const s=styleCol(i);if(s&&!MS[a[3]])MS[a[3]]=s}))}}catch(x){}}
let st=sts.map((id,i)=>{const a=A(id);return{id,n:a[2]||a[7]||'Lantai '+(i+1),z:a[5]?lp(a[5]).elements[14]:0,e:a[9]||0}});
if(st.length&&Math.max(...st.map(x=>x.z))-Math.min(...st.map(x=>x.z))<1e-6)st.forEach(x=>x.z=x.e);
st.sort((a,b)=>a.z-b.z);st=st.slice(0,24);
const items=[],mn=[1e18,1e18,1e18],mx=[-1e18,-1e18,-1e18];
for(const id of prods){try{const a=A(id),o=[],mp=typeof a[5]=='number'?lp(a[5]):new M4();let sty=null;
for(const r of A(a[6])[2]){const ra=A(r);if(ra[1]=='Body')ra[3].forEach(it=>{item(it,mp,o);if(!sty)sty=itemStyle(it)})}
if(o.length<9)continue;const mi=matIds(REL.mat[id]);if(!sty)for(const x of mi)if(MS[x]){sty=MS[x];break}
let z0=1e18,z1=-1e18;
for(let i=0;i<o.length;i+=3)for(let k=0;k<3;k++){const x=o[i+k];if(x<mn[k])mn[k]=x;if(x>mx[k])mx[k]=x;if(k==2){if(x<z0)z0=x;if(x>z1)z1=x}}
const sp=E[id].t=='IFCSPACE';items.push({id,t:E[id].t,o,z:(z0+z1)/2,sty,mn:mi.map(x=>pv(A(x)[0])).join(' '),n:(sp?[a[2],a[7]]:[a[2]]).filter(x=>typeof x=='string'&&x).join(' ')||(sp?'Ruang':E[id].t)})}catch(x){}}
if(!items.length)throw new Error('tidak ada geometri yang bisa dibaca');
if(!st.length)st=[{id:null,n:'Model',z:mn[2]}];
/* titik asal bersama (federasi) */
const cxm=(mn[0]+mx[0])/2*u,cym=(mn[1]+mx[1])/2*u,own=[cxm,cym,mn[2]*u];let org=ORG,note='';
if(!org)org=ORG=own;else if(Math.hypot(cxm-org[0],cym-org[1])>2000){org=own;note=` ${label} berada sangat jauh dari model lain, jadi diletakkan di titik pusat.`}
if(models[0]&&models[0].demo)dropModel(models[0]);
M.box={x0:mn[0]*u-org[0],x1:mx[0]*u-org[0],y0:mn[2]*u-org[2],y1:mx[2]*u-org[2],z0:-(mx[1]*u-org[1]),z1:-(mn[1]*u-org[1])};M.cx=(M.box.x0+M.box.x1)/2;M.cz=(M.box.z0+M.box.z1)/2;
const sti={};st.forEach((x,i)=>{if(x.id!=null)sti[x.id]=i});
const fi=z=>{let k=0;st.forEach((x,i)=>{if(x.z<=z+1e-6)k=i});return k},fe=it=>{const k=sti[REL.cont[it.id]];return k!=null?k:fi(it.z)},
cv3=o=>{const p=new Float32Array(o.length);for(let i=0;i<o.length;i+=3){p[i]=o[i]*u-org[0];p[i+1]=o[i+2]*u-org[2];p[i+2]=-(o[i+1]*u-org[1])}return p},
geo=p=>{const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(p,3));g.computeVertexNormals();return g};
const fl=st.map(x=>({g:new THREE.Group(),m:M,y:x.z*u-org[2],name:x.n,pk:[],rooms:[]}));
const buf={},newRooms=[];
items.forEach(it=>{const F=fl[fe(it)],p=cv3(it.o),key=M.k+':'+it.id,el=ELS[key]={key,id:it.id,t:it.t,n:it.n,F,m:M,src:it.sty?'dari file IFC':'bawaan (menurut kelas/material)'};
if(it.t=='IFCSPACE'){const a=[1e18,1e18,1e18],b=[-1e18,-1e18,-1e18];let ar=0;
for(let i=0;i<p.length;i+=9){for(let v=0;v<3;v++)for(let k=0;k<3;k++){const x=p[i+v*3+k];if(x<a[k])a[k]=x;if(x>b[k])b[k]=x}
ar+=Math.abs((p[i+5]-p[i+2])*(p[i+6]-p[i])-(p[i+3]-p[i])*(p[i+8]-p[i+2]))/4}
const mesh=new THREE.Mesh(geo(p),new THREE.MeshStandardMaterial({color:new THREE.Color().setHSL((rooms.length+newRooms.length)*.16%1,.55,.55),transparent:true,opacity:.28,depthWrite:false,side:DS}));
mesh.renderOrder=1;const q={key,id:it.id,name:it.n,F,x:(a[0]+b[0])/2,z:(a[2]+b[2])/2,area:ar,mesh};mesh.userData.r=q;el.room=q;F.g.add(mesh);F.rooms.push(q);newRooms.push(q)}
else{const kind=kindOf(it.t,it.mn),d=KIND[kind],hex=it.sty?rgb(it.sty.c):d[0],op=Math.max(.05,Math.min(1,it.sty?it.sty.o:kind=='glass'?.45:1)),bk=fl.indexOf(F)+'|'+kind+'|'+hex+'|'+op.toFixed(2),
B=buf[bk]=buf[bk]||{F,mk:[kind,hex,op],a:[],ids:[]};B.a.push(p);B.ids.push(key)}});
for(const k in buf){const b=buf[k],tot=b.a.reduce((n,x)=>n+x.length,0),all=new Float32Array(tot),starts=[];let o=0;b.a.forEach(x=>{starts.push(o/9);all.set(x,o);o+=x.length});starts.push(o/9);
const mesh=new THREE.Mesh(geo(all),mat(...b.mk));mesh.userData.map={s:starts,ids:b.ids};
b.ids.forEach((key,i)=>{const el=ELS[key];el.mesh=mesh;el.s=starts[i];el.e=starts[i+1]});b.F.g.add(mesh);b.F.pk.push(mesh)}
M.floors=fl.filter(F=>F.pk.length||F.rooms.length);M.floors.forEach(F=>M.g.add(F.g));
sc.add(M.g);models.push(M);floors.push(...M.floors);rooms.push(...newRooms);buildLevels();fitAll();ui();
return note}
async function loadMany(items){if(!items.length)return;let ok=0,notes='';const bad=[];
for(let i=0;i<items.length;i++){const it=items[i];hint(`Memuat ${it.name} (${i+1}/${items.length})…`);
try{const t=await it.get();await new Promise(r=>setTimeout(r,30));notes+=loadIFC(t,it.name);if(it.vid)models[models.length-1].vid=it.vid;ok++}catch(x){bad.push(`${it.name}: ${x.message}`);if(!models.some(m=>!m.demo))ORG=null}}

/* login & pustaka terenkripsi */
let KEY=null,REV='',LIB=[],USERS=[];
const CN='gtwin-vault-v1';let CACHED=new Set();
async function cget(u){try{const c=await caches.open(CN),r=await c.match(u);return r?await r.arrayBuffer():null}catch(e){return null}}
async function cput(u,b){try{const c=await caches.open(CN);await c.put(u,new Response(b))}catch(e){}}
function refreshCached(){if(!self.caches)return;caches.open(CN).then(async c=>{const ks=await c.keys(),cnt={},keep=new Set(LIB.map(m=>m.id));
for(const k of ks){const mm=/m_([^.]+)\.(\d+)\.bin/.exec(k.url);if(!mm)continue;if(!keep.has(mm[1])){await c.delete(k);continue}cnt[mm[1]]=(cnt[mm[1]]||0)+1}
CACHED=new Set(LIB.filter(m=>cnt[m.id]>=m.chunks).map(m=>m.id));libRender()}).catch(()=>{})}
async function fetchModel(m){const d=new TextDecoder(),parts=[];
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
for(let i=0;i<m.chunks;i++){const u=`vault/m_${m.id}.${i}.bin`;let buf=await cget(u),plain=null;
if(buf){hint(`Membuka ${m.name} dari penyimpanan perangkat (${i+1}/${m.chunks})…`);try{plain=await aesDec(KEY,buf)}catch(e){buf=null}}
if(!plain){hint(`Mengunduh ${m.name} (${i+1}/${m.chunks})…`);const r=await fetch(`${u}?r=${REV}`);if(!r.ok)throw new Error(`bagian ${i+1} tidak ditemukan`);buf=await r.arrayBuffer();plain=await aesDec(KEY,buf);await cput(u,buf)}
parts.push(d.decode(plain,{stream:true}))}
parts.push(d.decode());refreshCached();return parts.join('')}
function libRender(){const el=$('#lib');if(!KEY){el.hidden=true;return}el.hidden=false;
el.innerHTML='<div class="mh">Pustaka model</div>'+(LIB.length?LIB.map((m,i)=>{const on=models.some(x=>x.vid===m.id);return`<label class="mr"><input type="checkbox" data-lib="${i}"${on?' checked disabled':''}><span class="mn" title="${esc(m.name)}">${esc(m.name)}</span><span class="mu" style="margin:0">${on?'dimuat':(CACHED.has(m.id)?'tersimpan · ':'')+(m.size/1048576).toFixed(1)+' MB'}</span></label>`}).join('')+'<button class="b" id="lb" style="margin:6px 0 4px">Muat terpilih</button>'+(CACHED.size?' <button class="b" id="lc" style="margin:6px 0 4px" title="Hapus salinan terenkripsi di perangkat ini">Hapus data tersimpan</button>':''):'<p class="mu">Pustaka masih kosong.</p>')}
