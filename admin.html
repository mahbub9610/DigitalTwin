<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GTwin Admin</title>
<style>
:root{--bg:#eef2f4;--pn:#fff;--tx:#14212b;--mu:#66757f;--ac:#0b7a75;--ak:#fff;--bd:#d5dde2;--er:#b3261e}
@media (prefers-color-scheme:dark){:root{--bg:#0e1519;--pn:#172127;--tx:#e4ebef;--mu:#8696a1;--ac:#4fd1c5;--ak:#04201e;--bd:#2a3841;--er:#ff8a80}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.45 "Segoe UI",system-ui,sans-serif}
main{max-width:720px;margin:0 auto;padding:20px 16px 60px}
h1{font-size:20px;margin:0 0 4px}h2{font-size:16px;margin:0 0 10px}
section{background:var(--pn);border:1px solid var(--bd);border-radius:10px;padding:14px;margin:14px 0}
.mu{color:var(--mu)}.er{color:var(--er)}
label{display:block;margin:8px 0;font-weight:500}
input[type=text],input[type=password],input:not([type]){display:block;width:100%;margin-top:4px;padding:8px 10px;border:1px solid var(--bd);border-radius:7px;background:var(--bg);color:var(--tx);font:inherit}
.b{font:500 13px inherit;font-family:inherit;padding:7px 12px;border:1px solid var(--bd);background:var(--pn);color:var(--tx);border-radius:7px;cursor:pointer;display:inline-block}
.b.p{background:var(--ac);color:var(--ak);border-color:var(--ac)}
.b:disabled{opacity:.5;cursor:default}
.b:focus-visible,input:focus-visible{outline:2px solid var(--ac);outline-offset:1px}
.row{display:flex;align-items:center;gap:8px;padding:6px 0;border-top:1px solid var(--bd)}
.row:first-child{border-top:0}.row .n{flex:1;min-width:0;overflow-wrap:anywhere}
pre{white-space:pre-wrap;background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:10px;max-height:220px;overflow:auto;font-size:12px}
[hidden]{display:none!important}
</style></head>
<body><main>
<h1>GTwin · Admin</h1>
<p class="mu" id="am">Memeriksa vault…</p>

<section id="s0" hidden>
<h2 id="s0t">Masuk</h2>
<form id="f0">
<label>Nama pengguna<input id="u0" autocomplete="username" required></label>
<label>Kata sandi<input id="p0" type="password" autocomplete="current-password" required></label>
<label id="c0l" hidden>Ulangi kata sandi<input id="c0" type="password" autocomplete="new-password"></label>
<button class="b p" id="b0">Masuk</button>
</form>
</section>

<div id="w" hidden>
<section>
<h2>Model</h2>
<div id="ml"></div>
<p><label class="b" for="fm">Tambah model IFC…</label><input id="fm" type="file" accept=".ifc" multiple hidden></p>
</section>
<section>
<h2>Pengguna</h2>
<div id="ul"></div>
<form id="fu">
<label>Nama pengguna baru<input id="u1" autocomplete="off" required></label>
<label>Kata sandi (minimal 10 karakter)<input id="p1" type="password" autocomplete="new-password" required minlength="10"></label>
<button class="b" id="b1">Simpan pengguna</button>
<span class="mu"> Nama yang sudah ada akan diberi kata sandi baru.</span>
</form>
</section>
<section>
<h2>Terbitkan perubahan</h2>
<p id="pd" class="mu"></p>
<button class="b p" id="bz" disabled>Unduh ZIP perubahan</button>
<details style="margin-top:12px"><summary>Unggah langsung ke GitHub</summary>
<label>Repositori (pemilik/nama)<input id="g1" placeholder="akunanda/gtwin"></label>
<label>Cabang<input id="g2" value="main"></label>
<label>Token GitHub (izin Contents: Read and write, hanya untuk repo ini)<input id="g3" type="password" autocomplete="off"></label>
<button class="b" id="bg" disabled>Unggah ke GitHub</button>
<p class="mu">Token hanya disimpan di memori halaman ini dan hilang saat halaman ditutup.</p>
</details>
</section>
<pre id="lg"></pre>
</div>
</main>
<script src="vault.js"></script>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"]/g,c=>'&#'+c.charCodeAt(0)+';');
let USERS=[],MAN={rev:'',models:[]},KEY=null,ME='',PEND=new Map(),DEL=new Set(),exists=false,busy=false;
const log=t=>{const l=$('#lg');l.textContent+=t+'\n';l.scrollTop=l.scrollHeight},newRev=()=>hex(4),mb=n=>(n/1048576).toFixed(1)+' MB';
async function run(fn){if(busy)return;busy=true;document.querySelectorAll('button').forEach(b=>b.dataset.d=b.disabled?1:'');document.querySelectorAll('button').forEach(b=>b.disabled=true);
try{await fn()}catch(x){log('Gagal: '+x.message);$('#am').textContent='Gagal: '+x.message;$('#am').className='er'}
busy=false;document.querySelectorAll('button').forEach(b=>b.disabled=false);render()}
async function commitMeta(){PEND.set('users.json',new Blob([JSON.stringify({v:1,users:USERS})]));PEND.set('manifest.enc',await encJSON(KEY,MAN))}
function render(){
$('#ml').innerHTML=MAN.models.map((m,i)=>`<div class="row"><span class="n">${esc(m.name)} <span class="mu">${mb(m.size)} · ${m.chunks} bagian</span></span><button class="b" data-dm="${i}">Hapus</button></div>`).join('')||'<p class="mu">Belum ada model.</p>';
$('#ul').innerHTML=USERS.map((u,i)=>`<div class="row"><span class="n">${esc(u.u)}${u.u===ME?' <span class="mu">(Anda)</span>':''}</span>${u.u===ME||USERS.length<2?'':`<button class="b" data-du="${i}">Hapus akses</button>`}</div>`).join('');
let sz=0;PEND.forEach(b=>sz+=b.size);$('#pd').textContent=PEND.size||DEL.size?`${PEND.size} berkas siap diterbitkan (${mb(sz)})${DEL.size?`, ${DEL.size} berkas lama perlu dihapus`:''}.`:'Belum ada perubahan.';
const has=PEND.size||DEL.size;$('#bz').disabled=!has;$('#bg').disabled=!has}
async function readChunk(p){if(PEND.has(p))return PEND.get(p).arrayBuffer();const r=await fetch('vault/'+p+'?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw new Error('tidak bisa membaca '+p);return r.arrayBuffer()}
async function rotate(){const old=KEY,nk=await newMaster();log('Memutar kunci enkripsi…');
for(const m of MAN.models)for(let i=0;i<m.chunks;i++){const p=`m_${m.id}.${i}.bin`;PEND.set(p,new Blob([await aesEnc(nk,await aesDec(old,await readChunk(p)))]));log(`  ${m.name} bagian ${i+1}/${m.chunks}`)}
USERS=await Promise.all(USERS.map(u=>rewrap(u,nk)));KEY=nk;MAN.rev=newRev();await commitMeta()}
function download(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),60000)}
async function init(){try{const r=await fetch('vault/users.json?t='+Date.now(),{cache:'no-store'});if(r.ok){USERS=(await r.json()).users;exists=USERS.length>0}}catch(x){}
$('#s0').hidden=false;
if(exists){$('#s0t').textContent='Masuk ke vault';$('#am').textContent='Vault ditemukan. Masuk dengan akun pemilik.'}
else{$('#s0t').textContent='Buat vault baru';$('#c0l').hidden=false;$('#c0').required=true;$('#p0').minLength=10;$('#b0').textContent='Buat vault';$('#am').textContent='Vault belum ada. Buat akun pemilik pertama (kata sandi minimal 10 karakter).'}}
$('#f0').onsubmit=e=>{e.preventDefault();run(async()=>{const u=$('#u0').value.trim(),p=$('#p0').value;
if(exists){try{KEY=await vaultLogin(USERS,u,p,true)}catch(x){throw new Error('nama pengguna atau kata sandi salah')}
ME=USERS.find(x=>x.u.toLowerCase()===u.toLowerCase()).u;
const r=await fetch('vault/manifest.enc?t='+Date.now(),{cache:'no-store'});MAN=r.ok?await decJSON(KEY,await r.arrayBuffer()):{rev:newRev(),models:[]};log('Masuk sebagai '+ME+'.')}
else{if(p.length<10)throw new Error('kata sandi minimal 10 karakter');if(p!==$('#c0').value)throw new Error('kata sandi tidak sama');
KEY=await newMaster();USERS=[await makeUser(u,p,KEY)];ME=u;MAN={rev:newRev(),models:[]};await commitMeta();log('Vault baru dibuat. Tambahkan model, lalu terbitkan.')}
$('#s0').hidden=true;$('#w').hidden=false;$('#am').textContent='Terbuka sebagai '+ME+'.';$('#am').className='mu';$('#p0').value=$('#c0').value=''})};
$('#fm').onchange=e=>{const fs=[...e.target.files];e.target.value='';run(async()=>{for(const f of fs){if(!f.size){log(f.name+': file kosong, dilewati');continue}
log(`Mengenkripsi ${f.name} (${mb(f.size)})…`);const r=await encModel(KEY,f,n=>log(`  bagian ${n}`));r.files.forEach(x=>PEND.set(x.path,x.blob));
MAN.models.push({id:r.id,name:f.name,size:f.size,chunks:r.chunks,added:Date.now()})}await commitMeta();log('Selesai. Terbitkan perubahan agar model muncul bagi pengguna.')})};
$('#ml').onclick=e=>{const b=e.target.closest('[data-dm]');if(!b)return;const m=MAN.models[+b.dataset.dm];if(!confirm(`Hapus model "${m.name}" dari vault?`))return;
run(async()=>{MAN.models=MAN.models.filter(x=>x!==m);for(let i=0;i<m.chunks;i++){const p=`m_${m.id}.${i}.bin`;if(PEND.has(p))PEND.delete(p);else DEL.add(p)}await commitMeta();log('Model dihapus dari daftar.')})};
$('#fu').onsubmit=e=>{e.preventDefault();run(async()=>{const u=$('#u1').value.trim(),p=$('#p1').value;if(p.length<10)throw new Error('kata sandi minimal 10 karakter');
const rec=await makeUser(u,p,KEY),i=USERS.findIndex(x=>x.u.toLowerCase()===u.toLowerCase());if(i>=0)USERS[i]=rec;else USERS.push(rec);
await commitMeta();$('#u1').value=$('#p1').value='';log(`Pengguna "${u}" disimpan. Berikan nama dan kata sandi itu kepadanya.`)})};
$('#ul').onclick=e=>{const b=e.target.closest('[data-du]');if(!b)return;const u=USERS[+b.dataset.du];
if(!confirm(`Cabut akses "${u.u}"? Kunci enkripsi akan diputar dan semua model dienkripsi ulang.`))return;
run(async()=>{USERS=USERS.filter(x=>x!==u);await rotate();log(`Akses "${u.u}" dicabut. Terbitkan perubahan agar berlaku.`)})};
$('#bz').onclick=()=>run(async()=>{const files=[...PEND].sort((a,b)=>(/^(manifest|users)/.test(a[0])?1:0)-(/^(manifest|users)/.test(b[0])?1:0)).map(([p,b])=>['vault/'+p,b]);
if(DEL.size)files.push(['HAPUS-DARI-REPO.txt',new Blob([[...DEL].map(p=>'vault/'+p).join('\n')+'\n'])]);
log('Menyusun ZIP…');download(await zipBlob(files),'gtwin-vault-perubahan.zip');log('ZIP diunduh. Ekstrak ke folder repositori, hapus berkas di HAPUS-DARI-REPO.txt bila ada, lalu commit dan push.')});
$('#bg').onclick=()=>run(async()=>{const repo=$('#g1').value.trim(),br=$('#g2').value.trim()||'main',tok=$('#g3').value.trim();
if(!/^[\w.-]+\/[\w.-]+$/.test(repo))throw new Error('isi repositori dengan format pemilik/nama');if(!tok)throw new Error('isi token GitHub');
const api=(m,p,body)=>fetch(`https://api.github.com/repos/${repo}/contents/vault/${p}${m=='PUT'?'':'?ref='+encodeURIComponent(br)}`,{method:m=='GET'?'GET':m,headers:{Authorization:'Bearer '+tok,Accept:'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'},body:body&&JSON.stringify(body)}),
sha=async p=>{const r=await api('GET',p);if(r.status==404)return undefined;if(!r.ok)throw new Error(`GitHub ${r.status} saat memeriksa ${p}`);return(await r.json()).sha},
b64f=b=>new Promise((ok,no)=>{const f=new FileReader();f.onload=()=>ok(f.result.split(',')[1]);f.onerror=no;f.readAsDataURL(b)});
const order=[...PEND.keys()].sort((a,b)=>(/^(manifest|users)/.test(a)?1:0)-(/^(manifest|users)/.test(b)?1:0)||(a=='users.json')-(b=='users.json'));
let n=0;for(const p of order){log(`Mengunggah ${p} (${++n}/${order.length})…`);const s=await sha(p),r=await api('PUT',p,{message:'GTwin: perbarui '+p,content:await b64f(PEND.get(p)),branch:br,sha:s});
if(!r.ok)throw new Error(`GitHub ${r.status} saat mengunggah ${p}${r.status==401||r.status==403?' (periksa token dan izinnya)':''}`);PEND.delete(p)}
for(const p of [...DEL]){log('Menghapus '+p+'…');const s=await sha(p);if(s){const r=await api('DELETE',p,{message:'GTwin: hapus '+p,branch:br,sha:s});if(!r.ok)throw new Error(`GitHub ${r.status} saat menghapus ${p}`)}DEL.delete(p)}
log('Selesai. GitHub Pages butuh sekitar satu sampai dua menit untuk memperbarui situs.')});
init().then(render);
</script></body></html>
